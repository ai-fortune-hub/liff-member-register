<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>月詠アオイ｜会員登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #0e0f1a;
      color: #ffffff;
      padding: 24px;
    }
    h1 { font-size: 20px; }
    label { display: block; margin-top: 16px; }
    select, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: none;
    }
    button {
      background: #6f7cff;
      color: #fff;
      margin-top: 24px;
    }
  </style>
</head>

<body>

<h1>🌙 月詠アオイ 会員登録</h1>
<p>LINE内で簡単に登録できます</p>

<form id="registerForm">
  <label>
    年代
    <select id="age">
      <option value="">選択しない</option>
      <option value="20代">20代</option>
      <option value="30代">30代</option>
      <option value="40代">40代</option>
      <option value="50代以上">50代以上</option>
    </select>
  </label>

  <label>
    今気になっていること
    <select id="interest">
      <option value="恋愛">恋愛</option>
      <option value="仕事">仕事</option>
      <option value="人間関係">人間関係</option>
      <option value="なんとなく">なんとなく</option>
    </select>
  </label>

  <button type="submit">登録する</button>
</form>

<script>
async function initLIFF() {
  await liff.init({ liffId: "2008865871-TP9wuByO" });

  if (!liff.isLoggedIn()) {
    liff.login();
  }
}

initLIFF();

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const profile = await liff.getProfile();

  const payload = {
    lineUserId: profile.userId,
    displayName: profile.displayName,
    age: document.getElementById("age").value,
    interest: document.getElementById("interest").value,
    source: "liff-register"
  };

  fetch("https://hook.eu1.make.com/uvstd1gj6q9w4xj6ef7nepfdtimrap8v", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
  .then(() => {
    alert("登録が完了しました 🌙");
    liff.closeWindow();
  })
  .catch(err => {
    alert("送信に失敗しました");
    console.error(err);
  });
});

</script>

</body>
</html>
